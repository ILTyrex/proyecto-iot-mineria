services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: calidad_aire_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: calidad_aire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db/01_extension.sql:/docker-entrypoint-initdb.d/01_extension.sql:ro
      - ./init_db/02_hypertable_y_seed.sql:/scripts/02_hypertable_y_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calidad_aire_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: calidad_aire_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: calidad_aire_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      API_KEY: clave-secreta-esp32-2026
    ports:
      - "8000:8000"

volumes:
  pgdata:
